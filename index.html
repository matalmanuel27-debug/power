{name:'El Guardián Elemental',

// ====================== ESTADO ======================
function newProg(){return{level:0,powers:[],cur:-1,maxHearts:3,maxEnergy:10,regen:1,speed:0,bossDmg:1,score:0,decided:{},choices:[]};}
let prog=newProg(), snapshot=null;
let state='title', time=0, curLevel=0, levelTime=0;
let grid=null, items=[], enemies=[], boulders=[], projectiles=[], orbs=[], particles=[], texts=[];
let boss=null, exitPos=null, starsTotal=0, starsGot=0, player=null, shake=0, banner=null, castCD=0, auraT=0, eid=0;

function save(){try{localStorage.setItem('power_save',JSON.stringify(prog));}catch(e){}}
function loadSave(){try{const s=localStorage.getItem('power_save');return s?JSON.parse(s):null;}catch(e){return null;}}

// ====================== SONIDO ======================
let actx=null, muted=false, nbuf=null;
function ac(){if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();} if(actx.state==='suspended')actx.resume(); return actx;}
function tone(f,d,type='sine',v=.1,f2=null,delay=0){
 if(muted||!actx)return; const a=actx,t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t); if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,v=.15,f=1000,type='lowpass',delay=0){
 if(muted||!actx)return; const a=actx;
 if(!nbuf){nbuf=a.createBuffer(1,a.sampleRate,a.sampleRate);const ch=nbuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}
 const s=a.createBufferSource();s.buffer=nbuf;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;
 const g=a.createGain(),t=a.currentTime+delay;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02);}
const sfx={
 cast(p){[()=>{noise(.3,.25,900);tone(220,.25,'sawtooth',.05,90);},
  ()=>{tone(700,.22,'sine',.12,250);noise(.15,.08,2000,'bandpass');},
  ()=>{tone(1400,.25,'triangle',.07,2600);tone(2100,.2,'sine',.04,3000,.05);},
  ()=>{noise(.45,.22,1800,'bandpass');},
  ()=>{tone(1500,.12,'square',.05,150);noise(.18,.15,5000,'highpass');},
  ()=>{tone(140,.35,'sawtooth',.12,45);noise(.25,.15,400);}][p]();},
 star(){tone(988,.1,'square',.05);tone(1319,.25,'square',.05,null,.08);},
 power(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.08,null,i*.08));},
 hurt(){tone(240,.35,'square',.09,60);noise(.2,.15,600);},
 kill(){tone(600,.18,'square',.06,120);noise(.15,.1,1500);},
 solve(){tone(440,.12,'triangle',.08);tone(660,.2,'triangle',.08,null,.1);},
 nope(){tone(160,.15,'square',.05,120);},
 door(){[300,400,600,800].forEach((f,i)=>tone(f,.2,'sawtooth',.05,null,i*.07));},
 win(){[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.08,null,i*.12));},
 click(){tone(800,.06,'sine',.06);},
 boss(){tone(90,.8,'sawtooth',.12,40);noise(.8,.2,300);},
 shoot(){tone(330,.15,'sine',.05,180);},
 drop(){tone(200,.3,'sine',.12,50);noise(.3,.15,300);},
};
// Música de fondo sencilla
let mstep=0;
setInterval(()=>{
 if(muted||!actx||state!=='play')return;
 const bass=[110,110,98,87.31,110,130.8,98,87.31][Math.floor(mstep/8)%8];
 if(mstep%4===0)tone(bass,.6,'triangle',.05);
 if(mstep%2===0){const sc=[440,523.3,587.3,659.3,784];tone(sc[(mstep*3+Math.floor(mstep/8))%5]*(mstep%16===0?2:1),.2,'sine',.022);}
 mstep++;
},170);

// ====================== CARGA DE NIVEL ======================
function loadLevel(i){
 const L=LEVELS[i];
 grid=[];items=[];enemies=[];boulders=[];projectiles=[];orbs=[];particles=[];texts=[];
 boss=null;exitPos=null;starsTotal=0;starsGot=0;levelTime=0;castCD=0;
 let sx=1,sy=1;
 for(let y=0;y<ROWS;y++){
  const row=[];
  for(let x=0;x<COLS;x++){
   const ch=(L.map[y]||'')[x]||'#'; let t='.';
   if('#WIFVCHGD'.includes(ch))t=ch;
   else if(ch==='S'){sx=x;sy=y;}
   else if(ch==='E'){t='E';exitPos={x,y};}
   else if(ch==='*'){items.push({x,y,type:'star'});starsTotal++;}
   else if('123456'.includes(ch))items.push({x,y,type:'pill',p:+ch-1});
   else if(ch==='a')items.push({x,y,type:'altar'});
   else if(ch==='B')boulders.push({x,y,rx:x,ry:y});
   else if('rbg'.includes(ch))enemies.push({type:ch,x,y,rx:x,ry:y,fx:x,fy:y,t:1,moving:false,timer:Math.random(),alive:true,flash:0,id:eid++});
   else if(ch==='K')boss={x,y,hp:12,max:12,el:0,elT:7,shootT:2.5,flash:0,intro:2.5,kx:0,ky:0};
   row.push(t);
  }
  grid.push(row);
 }
 let pw=prog.powers.includes(prog.cur)?prog.cur:(prog.powers.length?prog.powers[prog.powers.length-1]:-1);
 player={x:sx,y:sy,rx:sx,ry:sy,fx:sx,fy:sy,t:0,moving:false,dir:[0,1],hearts:prog.maxHearts,energy:prog.maxEnergy,inv:0,power:pw};
}

// ====================== UTILIDADES ======================
const WALK=new Set(['.','i','d','E']);
const tc=x=>x*T+T/2, tcy=y=>y*T+T/2+HUD;
function tileAt(x,y){return(y<0||y>=ROWS||x<0||x>=COLS)?'#':grid[y][x];}
function boulderAt(x,y){return boulders.find(b=>b.x===x&&b.y===y);}
function canWalk(x,y){return WALK.has(tileAt(x,y))&&!boulderAt(x,y);}
function enemyCanWalk(x,y){const t=tileAt(x,y);return(t==='.'||t==='i'||t==='d')&&!boulderAt(x,y)&&!enemies.some(e=>e.alive&&e.x===x&&e.y===y);}
function exitOpen(){return !!exitPos&&!boss&&starsGot>=starsTotal;}
function burst(x,y,color,n=16,spd=160,life=.6,size=4,grav=0){
 for(let i=0;i<n;i++){const a=Math.random()*6.283,s=spd*(.3+Math.random()*.7);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*(.6+Math.random()*.6),max:life,color,size:size*(.5+Math.random()*.8),grav});}}
function addText(str,tx,ty,color='#fff'){texts.push({str,x:tc(tx),y:tcy(ty)-20,color,life:1.3});}
function showBanner(title,sub,color='#ffe08a',dur=3){banner={title,sub,color,life:dur,max:dur};}

// ====================== JUGADOR ======================
const DIRS={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
let dirStack=[];
function updatePlayer(dt){
 const p=player, spd=6.5*(1+prog.speed*.18);
 if(p.moving){
  p.t+=dt*spd;
  if(p.t>=1){p.moving=false;p.rx=p.x;p.ry=p.y;onArrive();}
  else{p.rx=p.fx+(p.x-p.fx)*p.t;p.ry=p.fy+(p.y-p.fy)*p.t;}
 }
 if(!p.moving&&state==='play'&&dirStack.length){
  const d=DIRS[dirStack[dirStack.length-1]]; p.dir=d;
  const nx=p.x+d[0],ny=p.y+d[1];
  if(canWalk(nx,ny)){p.fx=p.x;p.fy=p.y;p.x=nx;p.y=ny;p.t=0;p.moving=true;}
 }
}
function onArrive(){
 const it=items.find(i=>i.x===player.x&&i.y===player.y);
 if(it){
  if(it.type==='star'){
   items.splice(items.indexOf(it),1);starsGot++;prog.score+=100;sfx.star();
   burst(tc(it.x),tcy(it.y),'#ffe066',24,200,.7,4);addText('+100 ⭐',it.x,it.y,'#ffe066');
   if(starsGot===starsTotal&&exitPos){showBanner('¡PORTAL ABIERTO!','Ve al portal para completar la misión','#d59bff',2.5);sfx.door();}
  }else if(it.type==='pill'){
   items.splice(items.indexOf(it),1);givePower(it.p);
  }else if(it.type==='altar'){
   items.splice(items.indexOf(it),1);openAltar();
  }
 }
 if(tileAt(player.x,player.y)==='E'&&exitOpen())levelComplete();
}
function givePower(p){
 const P=POWERS[p];
 if(!prog.powers.includes(p)){
  prog.powers.push(p);prog.powers.sort();player.power=p;prog.cur=p;prog.score+=200;
  showBanner(`¡PODER DE ${P.name.toUpperCase()}! ${P.icon}`,P.desc,P.color,3.5);sfx.power();
  for(let k=0;k<3;k++)burst(tc(player.x),tcy(player.y),P.color,30,260+k*60,1,5);
  shake=8;
 }else{
  prog.score+=250;player.energy=prog.maxEnergy;addText('+250 ¡Energía llena!',player.x,player.y,P.color);sfx.star();
 }
}
function selectPower(p){if(prog.powers.includes(p)&&player.power!==p){player.power=p;prog.cur=p;sfx.click();burst(tc(player.rx),tcy(player.ry),POWERS[p].color,12,120,.4,3);}}
function cyclePower(d){if(!prog.powers.length)return;let i=prog.powers.indexOf(player.power);i=(i+d+prog.powers.length)%prog.powers.length;selectPower(prog.powers[i]);}
function cast(){
 if(player.power<0){addText('¡Busca una píldora de poder!',player.x,player.y,'#ccc');sfx.nope();return;}
 if(castCD>0)return;
 if(player.energy<1){addText('Sin energía...',player.x,player.y,'#999');sfx.nope();castCD=.3;return;}
 player.energy-=1;castCD=.22;
 const x=Math.round(player.rx),y=Math.round(player.ry);
 projectiles.push({x:player.rx,y:player.ry,dx:player.dir[0],dy:player.dir[1],p:player.power,tx:x,ty:y,life:0});
 sfx.cast(player.power);
}
function hurt(){
 if(player.inv>0||state!=='play')return;
 player.hearts--;player.inv=1.3;shake=12;sfx.hurt();
 burst(tc(player.rx),tcy(player.ry),'#ff3b5c',20,200,.6,4);

// ====================== PODERES ======================
function projEnter(pr,tx,ty){
 const p=pr.p,t=tileAt(tx,ty);
 const b=boulderAt(tx,ty);
 if(b){
  if(p===VIENTO&&!b.falling){pushBoulder(b,pr.dx,pr.dy);}
  else addText('✖',tx,ty,'#aaa');
  return true;
 }
 switch(t){
  case '.':case 'i':case 'd':case 'E':return false;
  case 'W':if(p===HIELO){grid[ty][tx]='i';solved(tx,ty,'#e6fdff','¡Congelado!');return true;}return false;
  case 'H':if(p===TIERRA){grid[ty][tx]='.';solved(tx,ty,'#c48a4a','¡Relleno!');return true;}return false;
  case 'I':if(p===FUEGO){grid[ty][tx]='.';solved(tx,ty,'#9ff3ff','¡Derretido!');}else nope(tx,ty);return true;
  case 'V':if(p===FUEGO){grid[ty][tx]='.';solved(tx,ty,'#ff8a2a','¡Quemado!');}else nope(tx,ty);return true;
  case 'F':if(p===AGUA){grid[ty][tx]='.';solved(tx,ty,'#cfe9ff','¡Apagado!');burst(tc(tx),tcy(ty),'#bbbbbb',20,60,1.2,6,-60);}else nope(tx,ty);return true;
  case 'C':if(p===TIERRA){grid[ty][tx]='.';solved(tx,ty,'#c48a4a','¡Destruido!');shake=8;}else nope(tx,ty);return true;
  case 'G':
   if(p===RAYO){grid[ty][tx]='A';solved(tx,ty,'#ffe53b','¡Energía!');
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(grid[y][x]==='D'){grid[y][x]='d';burst(tc(x),tcy(y),'#ffe53b',20,180,.6,3);}
    showBanner('¡PUERTAS ABIERTAS!','El generador ha encendido la fábrica','#ffe53b',2);sfx.door();
   }else nope(tx,ty);return true;
  default:return true;
 }
}
function solved(x,y,color,msg){burst(tc(x),tcy(y),color,30,220,.8,5);addText(msg,x,y,color);prog.score+=20;sfx.solve();}
function nope(x,y){addText('✖ No funciona',x,y,'#bbb');sfx.nope();}
function pushBoulder(b,dx,dy){
 let x=b.x,y=b.y;
 while(true){
  const nx=x+dx,ny=y+dy,t=tileAt(nx,ny);
  if(t==='H'){x=nx;y=ny;b.falling=true;break;}
  if((t==='.'||t==='i'||t==='d')&&!boulderAt(nx,ny)&&!(player.x===nx&&player.y===ny)&&!items.some(i=>i.x===nx&&i.y===ny)){
   x=nx;y=ny;const e=enemies.find(e=>e.alive&&e.x===nx&&e.y===ny);if(e)killEnemy(e,'¡Aplastado!');
  }else break;
 }
 if(x===b.x&&y===b.y){addText('No se mueve',x,y,'#ccc');return;}
 b.x=x;b.y=y;sfx.solve();
}
function updateBoulders(dt){
 for(const b of boulders){
  const sp=12*dt;
  b.rx+=Math.max(-sp,Math.min(sp,b.x-b.rx));b.ry+=Math.max(-sp,Math.min(sp,b.y-b.ry));
  if(Math.random()<.3&&(b.rx!==b.x||b.ry!==b.y))particles.push({x:tc(b.rx),y:tcy(b.ry)+14,vx:(Math.random()-.5)*40,vy:-20,life:.4,max:.4,color:'#8a7f72',size:3,grav:0});
  if(b.falling&&b.rx===b.x&&b.ry===b.y){
   b.fs=(b.fs===undefined?1:b.fs)-dt*3;
   if(b.fs<=0){b.dead=true;grid[b.y][b.x]='.';burst(tc(b.x),tcy(b.y),'#a59a8c',30,160,.8,5);addText('¡Camino creado!',b.x,b.y,'#e8dcc8');sfx.drop();shake=6;prog.score+=20;}
  }
 }
 boulders=boulders.filter(b=>!b.dead);
}
function updateProjectiles(dt){
 for(const pr of projectiles){
  const sp=14*dt;pr.x+=pr.dx*sp;pr.y+=pr.dy*sp;pr.life+=dt;
  const col=POWERS[pr.p].color;
  particles.push({x:tc(pr.x)+(Math.random()-.5)*10,y:tcy(pr.y)+(Math.random()-.5)*10,vx:-pr.dx*40,vy:-pr.dy*40+(pr.p===FUEGO?-40:0),life:.35,max:.35,color:col,size:4,grav:0});
  for(const e of enemies){if(e.alive&&Math.hypot(e.rx-pr.x,e.ry-pr.y)<.55){hitEnemy(e,pr.p);pr.dead=true;break;}}
  if(pr.dead){impact(pr);continue;}
  for(const o of orbs){if(Math.hypot(o.x-pr.x,o.y-pr.y)<.55){o.dead=true;burst(tc(o.x),tcy(o.y),o.color,10,120,.4,3);}}
  if(boss&&boss.intro<=0&&Math.hypot(boss.x-pr.x,boss.y-pr.y)<.9){hitBoss(pr);pr.dead=true;impact(pr);continue;}
  const tx=Math.round(pr.x),ty=Math.round(pr.y);
  if(tx!==pr.tx||ty!==pr.ty){pr.tx=tx;pr.ty=ty;if(projEnter(pr,tx,ty)){pr.dead=true;impact(pr);}}
 }
 projectiles=projectiles.filter(p=>!p.dead);
}
function impact(pr){
 const x=tc(pr.x),y=tcy(pr.y),c=POWERS[pr.p].color;
 const g=[-120,250,0,0,0,300][pr.p];
 burst(x,y,c,18,170,.5,4,g);burst(x,y,'#ffffff',6,100,.3,2);
}

// ====================== ENEMIGOS ======================
const WEAK={r:[AGUA],b:[FUEGO],g:[VIENTO,RAYO]};
function hitEnemy(e,p){
 if(WEAK[e.type].includes(p))killEnemy(e,'¡Vencido!');
 else{e.flash=.3;addText('¡Inmune!',e.x,e.y,'#ffb3b3');sfx.nope();}
}
function killEnemy(e,msg){
 e.alive=false;prog.score+=50;sfx.kill();
 const c=e.type==='r'?'#ff6a3d':e.type==='b'?'#6fdcff':'#b98cff';
 burst(tc(e.rx),tcy(e.ry),c,30,220,.7,5);addText(msg+' +50',e.x,e.y,c);
}
function updateEnemies(dt){
 for(const e of enemies){
  if(!e.alive)continue;
  e.flash-=dt;
  const spd=e.type==='g'?1.8:2.3;
  if(e.moving){
   e.t+=dt*spd;
   if(e.t>=1){e.moving=false;e.rx=e.x;e.ry=e.y;}
   else{e.rx=e.fx+(e.x-e.fx)*e.t;e.ry=e.fy+(e.y-e.fy)*e.t;}
  }else{
   e.timer-=dt;
   if(e.timer<=0){
    e.timer=.25+Math.random()*.6;
    let ds=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-.5);
    const dist=Math.abs(player.x-e.x)+Math.abs(player.y-e.y);
    if(dist<7&&Math.random()<.6)ds.sort((a,b)=>(Math.abs(player.x-e.x-a[0])+Math.abs(player.y-e.y-a[1]))-(Math.abs(player.x-e.x-b[0])+Math.abs(player.y-e.y-b[1])));
    for(const d of ds){const nx=e.x+d[0],ny=e.y+d[1];if(enemyCanWalk(nx,ny)){e.fx=e.x;e.fy=e.y;e.x=nx;e.y=ny;e.t=0;e.moving=true;break;}}
   }
  }
  if(Math.hypot(e.rx-player.rx,e.ry-player.ry)<.6)hurt();
 }
}

// ====================== JEFE FINAL ======================
function updateBoss(dt){
 if(!boss)return;const b=boss;b.flash-=dt;
 if(b.intro>0){b.intro-=dt;if(Math.random()<.5)burst(tc(b.x),tcy(b.y),BE[Math.floor(Math.random()*4)].color,2,150,.6,4);
  if(b.intro<=0){showBanner('¡EL GUARDIÁN DESPIERTA!','Usa el poder opuesto a su forma','#ff7bd5',2.5);sfx.boss();shake=15;}return;}
 b.elT-=dt;
 if(b.elT<=0){b.el=(b.el+1)%4;b.elT=6.5;const E=BE[b.el];burst(tc(b.x),tcy(b.y),E.color,40,260,.8,5);addText(`¡Forma de ${E.name}!`,b.x,b.y-1,E.color);sfx.boss();}
 const rage=1-b.hp/b.max,dx=player.rx-b.x,dy=player.ry-b.y,d=Math.hypot(dx,dy)||1,sp=(1+rage*1.3)*dt;
 b.x+=dx/d*sp+b.kx*dt;b.y+=dy/d*sp+b.ky*dt;b.kx*=Math.pow(.02,dt);b.ky*=Math.pow(.02,dt);
 b.x=Math.max(1,Math.min(COLS-2,b.x));b.y=Math.max(1,Math.min(ROWS-2,b.y));
 b.shootT-=dt;
 if(b.shootT<=0){
  b.shootT=1.9-rage*1.0;const a=Math.atan2(dy,dx),n=rage>.5?3:1;
  for(let k=0;k<n;k++){const aa=a+(k-(n-1)/2)*.35;orbs.push({x:b.x,y:b.y,vx:Math.cos(aa)*4.2,vy:Math.sin(aa)*4.2,color:BE[b.el].color});}
  sfx.shoot();
 }
 if(Math.hypot(player.rx-b.x,player.ry-b.y)<.85)hurt();
}
function hitBoss(pr){
 const b=boss,E=BE[b.el];
 if(pr.p===E.weak){
  b.hp-=prog.bossDmg;b.flash=.2;shake=8;sfx.kill();
  burst(tc(b.x),tcy(b.y),E.color,30,250,.7,5);addText(`-${prog.bossDmg} ¡Golpe crítico!`,b.x,b.y-1,'#fff');
  if(b.hp<=0)bossDie();
 }else if(pr.p===VIENTO){b.kx=pr.dx*8;b.ky=pr.dy*8;addText('¡Empujado!',b.x,b.y-1,'#b8ffcf');}
 else{addText('¡Inmune!',b.x,b.y-1,'#ccc');sfx.nope();}
}
function bossDie(){
 const bx=boss.x,by=boss.y;
 for(let k=0;k<4;k++)burst(tc(bx),tcy(by),BE[k].color,50,300+k*60,1.3,6);
 shake=25;sfx.win();prog.score+=1000;boss=null;orbs=[];
 let best=null,bd=1e9;
 for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){
  if(grid[y][x]!=='.'||(x===player.x&&y===player.y)||items.some(i=>i.x===x&&i.y===y))continue;
  const d=Math.hypot(x-bx,y-by);if(d<bd){bd=d;best={x,y};}
 }
 grid[best.y][best.x]='E';exitPos=best;
 showBanner('¡GUARDIÁN DERROTADO!','Entra al portal para terminar tu aventura','#ffe08a',3.5);
}
function updateOrbs(dt){
 for(const o of orbs){
  o.x+=o.vx*dt;o.y+=o.vy*dt;
  const t=tileAt(Math.round(o.x),Math.round(o.y));
  if(t==='#'){o.dead=true;burst(tc(o.x),tcy(o.y),o.color,10,120,.4,3);continue;}
  if(Math.hypot(o.x-player.rx,o.y-player.ry)<.5){o.dead=true;hurt();}
 }
 orbs=orbs.filter(o=>!o.dead);
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function glow(x,y,r,color,a){
 const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,a));ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();}
function drawFloor(px,py,x,y){
 ctx.fillStyle=((x+y)&1)?'#1b1530':'#1e1736';ctx.fillRect(px,py,T,T);
 const h=((x*73856093)^(y*19349663))>>>0;
 if(h%4===0){ctx.fillStyle='rgba(255,255,255,.04)';ctx.fillRect(px+(h%30)+6,py+((h>>5)%30)+6,3,3);}
}
function drawWall(px,py,x,y){
 ctx.fillStyle='#2a2148';ctx.fillRect(px,py,T,T);

  if(cur)glow(bx+23,by+23,40,Pw.color,.7);
  ctx.fillStyle=own?'#2a1d5c':'#15102a';rr(bx,by,46,46,9);ctx.fill();
  ctx.strokeStyle=cur?'#fff':own?Pw.color:'#2f2650';ctx.lineWidth=cur?3:2;ctx.stroke();ctx.lineWidth=1;
  ctx.globalAlpha=own?1:.3;ctx.font='24px Segoe UI Emoji';ctx.fillText(own?Pw.icon:'?',bx+23,by+25);ctx.globalAlpha=1;
  ctx.font='bold 10px Segoe UI';ctx.fillStyle='#b9a8ff';ctx.fillText(i+1,bx+7,by+8);
 }
 if(P){ctx.font='bold 11px Segoe UI';ctx.fillStyle=P.color;ctx.fillText(P.name.toUpperCase(),cv.width/2,HUD-6);}
 ctx.textAlign='right';
 ctx.font='bold 15px Segoe UI';ctx.fillStyle='#ffe08a';ctx.fillText(`Misión ${curLevel+1}: ${LEVELS[curLevel].name}`,cv.width-14,20);
 ctx.font='bold 16px Segoe UI';ctx.fillStyle='#fff';
 const obj=boss?'⚔️ Derrota al Guardián':starsTotal?`⭐ ${starsGot}/${starsTotal}`:'🌀 ¡Al portal!';
 ctx.fillText(`${obj}    🏆 ${prog.score}${muted?'   🔇':''}`,cv.width-14,46);
 ctx.textAlign='center';
}
function drawBanner(){
 if(!banner)return;
 const a=Math.min(1,banner.life*2,(banner.max-banner.life)*4);
 ctx.globalAlpha=a;const y=HUD+ROWS*T/2;
 const g=ctx.createLinearGradient(0,0,cv.width,0);g.addColorStop(0,'rgba(5,3,20,0)');g.addColorStop(.5,'rgba(5,3,20,.85)');g.addColorStop(1,'rgba(5,3,20,0)');
 ctx.fillStyle=g;ctx.fillRect(0,y-55,cv.width,100);
 ctx.shadowColor=banner.color;ctx.shadowBlur=25;ctx.font='bold 40px Segoe UI';ctx.fillStyle=banner.color;ctx.fillText(banner.title,cv.width/2,y-15);
 ctx.shadowBlur=0;ctx.font='18px Segoe UI';ctx.fillStyle='#e4dcff';ctx.fillText(banner.sub,cv.width/2,y+22);
 ctx.globalAlpha=1;
}
let vign=null;
function render(){
 ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 ctx.fillStyle='#07041a';ctx.fillRect(-30,-30,cv.width+60,cv.height+60);
 if(grid){
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)drawTile(grid[y][x],x,y);
  drawItems();drawBoulders();drawEnemies();drawPlayer();drawBoss();drawProjectiles();
 }
 drawParticles();drawTexts();
 if(!vign){vign=ctx.createRadialGradient(cv.width/2,HUD+ROWS*T/2,ROWS*T*.35,cv.width/2,HUD+ROWS*T/2,cv.width*.65);vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,'rgba(0,0,0,.5)');}
 ctx.fillStyle=vign;ctx.fillRect(0,HUD,cv.width,ROWS*T);
 ctx.restore();
 if(grid&&player){drawHUD();drawBanner();}
}

// ====================== BUCLE PRINCIPAL ======================
function update(dt){
 time+=dt;
 for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;p.vx*=.98;}
 particles=particles.filter(p=>p.life>0);
 if(particles.length>1500)particles.splice(0,particles.length-1500);
 for(const t of texts){t.life-=dt;t.y-=30*dt;}
 texts=texts.filter(t=>t.life>0);
 shake=Math.max(0,shake-dt*40);
 if(banner){banner.life-=dt;if(banner.life<=0)banner=null;}
 if(!grid){
  if(Math.random()<.6){const c=POWERS[Math.floor(Math.random()*6)].color;particles.push({x:Math.random()*cv.width,y:cv.height+10,vx:(Math.random()-.5)*30,vy:-60-Math.random()*90,life:5,max:5,color:c,size:3+Math.random()*4,grav:0});}
  return;
 }
 if(state!=='play')return;
 levelTime+=dt;castCD-=dt;player.inv-=dt;
 player.energy=Math.min(prog.maxEnergy,player.energy+dt*.75*prog.regen);
 updatePlayer(dt);
 if(state!=='play')return;
 updateBoulders(dt);updateEnemies(dt);updateBoss(dt);updateProjectiles(dt);updateOrbs(dt);
 auraT-=dt;
 if(auraT<=0&&player.power>=0){auraT=.06;particles.push({x:tc(player.rx)+(Math.random()-.5)*26,y:tcy(player.ry)+14,vx:0,vy:-40-Math.random()*30,life:.6,max:.6,color:POWERS[player.power].color,size:2.5,grav:0});}
}
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 update(dt);render();
 requestAnimationFrame(loop);
}
titleScreen();
requestAnimationFrame(loop);
</script>
</body>
